services:
  postgres:
    image: postgres:17
    container_name: insurance_capture_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: insurance_capture
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: